name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android unit tests and debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          # v3 still defaults to the removed `tools` package, which fails the step.
          packages: platform-tools
      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Run lint, JVM tests, and assemble debug APK
        run: ./gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :benchmark:assemble
      - name: Release build keeps R8 and the baseline profile
        run: |
          ./gradlew :app:assembleRelease
          test -s app/build/outputs/mapping/release/mapping.txt
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          unzip -l "$apk" | grep -q 'assets/dexopt/baseline.prof'

  node:
    name: Shared and web tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install workspace dependencies
        run: npm ci
      - name: Install Tailwind Linux native binaries
        run: |
          npm install --no-save \
            "@tailwindcss/oxide-linux-x64-gnu@$(node -p "require('./web/node_modules/@tailwindcss/oxide/package.json').version")" \
            "lightningcss-linux-x64-gnu@$(node -p "require('./web/node_modules/lightningcss/package.json').version")"
      - name: Run shared and web tests
        run: npm test
      - name: Build web app
        run: npm run build --workspace=money-web
